- name: Configurar firewall básico
  hosts: servers
  become: yes

  tasks:

    # Instalar UFW si no está instalado
    - name: Instalar UFW
      apt:
        name: ufw
        state: present
        update_cache: yes

    # Permitir conexiones SSH en el puerto 22
    - name: Permitir SSH
      ufw:
        rule: allow
        port: 22
        proto: tcp

    # Denegar todo el tráfico entrante por defecto
    - name: Denegar tráfico entrante
      ufw:
        direction: incoming
        policy: deny

    # Permitir todo el tráfico saliente
    - name: Permitir tráfico saliente
      ufw:
        direction: outgoing
        policy: allow

    # Activar el firewall
    - name: Activar UFW
      ufw:
        state: enabled
