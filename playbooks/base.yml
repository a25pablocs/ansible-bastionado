# Playbook de preparación base del sistema
# Se ejecuta en todos los servidores del inventario

- name: Preparación base de servidores
  hosts: servers
  #become: ejecuta las tareas como root
  become: yes

  tasks:

    # Actualiza todos los paquetes del sistema
    - name: Actualizar sistema
      apt:
        update_cache: yes
        upgrade: dist

    # Instala paquetes básicos útiles para administración
    - name: Instalar herramientas básicas
      apt:
        name:
          - curl
          - vim
          - sudo
          - net-tools
        state: present

    # Crear usuario administrador para gestión
    - name: Crear usuario admin
      user:
        name: admin
        groups: sudo
        append: yes
        state: present
