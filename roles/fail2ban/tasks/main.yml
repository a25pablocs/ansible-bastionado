# Instalar Fail2Ban
- name: Instalar Fail2Ban
  apt:
    name: fail2ban
    state: present
    update_cache: yes

# Desplegar configuración personalizada
- name: Configurar jail.local para SSH
  copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime  = 300
      findtime = 60
      maxretry = 3

      [sshd]
      enabled  = true
      port     = ssh
      filter   = sshd
      logpath  = /var/log/auth.log

# Habilitar y arrancar el servicio
- name: Habilitar y arrancar Fail2Ban
  service:
    name: fail2ban
    enabled: yes
    state: started
